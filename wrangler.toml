name = "feno"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "feno-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
APP_NAME = "Feno"
SESSION_COOKIE_NAME = "feno_session"
SESSION_TTL_DAYS = "30"
